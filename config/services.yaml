services:
  _defaults:
    autowire: true
    autoconfigure: true

  App\:
    resource: "../src/"
    exclude:
      - "../src/Kernel.php"

  App\Controller\:
    resource: "../src/Controller/"
    tags: ["controller.service_arguments"]

  App\Service\StatsStore:
    arguments:
      $databasePath: "%kernel.project_dir%/var/freecell.sqlite"
